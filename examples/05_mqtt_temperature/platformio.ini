[platformio]
extra_configs = ../platformio-common.ini
src_dir = ../..
lib_dir = ../../lib
include_dir = include
default_envs = wemos_d1_mini32, c3_supermini

[env]
build_src_filter =
  -<*>
  +<examples/05_mqtt_temperature/src/main.cpp>
  +<src/net/wifi_manager.cpp>
  +<src/mqtt/mqtt_manager.cpp>
  +<src/mqtt/mqtt_light_module.cpp>
  +<src/sensors/mqtt_temperature_sensor.cpp>
  +<src/display/temperature_format.cpp>
build_flags =
  -I${PROJECT_DIR}/../../src
lib_deps =
  ${example.lib_deps}
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.0.0
