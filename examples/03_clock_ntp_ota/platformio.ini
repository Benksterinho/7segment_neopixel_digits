[platformio]
extra_configs = ../platformio-common.ini
src_dir = ../..
lib_dir = ../../lib
include_dir = include
default_envs = wemos_d1_mini32, c3_supermini

[env]
lib_deps = ${example.lib_deps}
build_flags =
  -I${PROJECT_DIR}/../../src
build_src_filter =
  -<*>
  +<examples/03_clock_ntp_ota/src/main.cpp>
  +<src/net/wifi_manager.cpp>
  +<src/net/time_sync.cpp>
  +<src/net/ota_manager.cpp>

[env:ota]
extends = env:wemos_d1_mini32
upload_protocol = espota
; Change this to your clock's IP address before uploading.
upload_port = 192.0.2.10
upload_flags = --timeout=60

[env:c3_supermini_ota]
extends = env:c3_supermini
upload_protocol = espota
; Change this to your clock's IP address before uploading.
upload_port = 192.0.2.11
upload_flags = --timeout=60
