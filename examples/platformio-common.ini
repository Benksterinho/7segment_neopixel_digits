; Shared settings for the independent projects in this directory.
[example]
lib_deps =
  adafruit/Adafruit NeoPixel@^1.12.3

[env]
platform = espressif32
framework = arduino
upload_speed = 115200
monitor_speed = 115200
[env:wemos_d1_mini32]
board = wemos_d1_mini32

[env:c3_supermini]
board = esp32-c3-devkitm-1
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DLED_DATA_PIN=4
