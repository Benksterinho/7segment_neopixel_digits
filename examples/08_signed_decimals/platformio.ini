[platformio]
extra_configs = ../platformio-common.ini
src_dir = ../..
lib_dir = ../../lib
include_dir = include
default_envs = wemos_d1_mini32, c3_supermini

[env]
build_flags =
  ${sysenv.EXAMPLE_BUILD_FLAGS}
  -I${PROJECT_DIR}/../../src
lib_deps = ${example.lib_deps}
build_src_filter =
  -<*>
  +<examples/08_signed_decimals/src/main.cpp>
  +<src/display/temperature_format.cpp>
