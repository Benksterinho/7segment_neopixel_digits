; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:wemos_d1_mini32]
platform = espressif32
board = wemos_d1_mini32
framework = arduino

upload_speed = 115200

monitor_speed = 115200
lib_deps =
  adafruit/Adafruit NeoPixel@^1.12.3
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.0.0

[env:ota]
extends = env:wemos_d1_mini32
upload_protocol = espota
; Replace with the fixed IP reserved for the ESP32 in your router (DHCP reservation)
upload_port = 192.168.178.193
upload_flags =
    --timeout=60

[env:c3_supermini]
extends = env:wemos_d1_mini32
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLED_DATA_PIN=4

[env:c3_supermini_ota]
extends = env:c3_supermini
upload_protocol = espota
; Replace with the fixed IP reserved for the ESP32-C3 in your router
upload_port = 192.168.178.50
upload_flags =
    --timeout=60